appId: io.github.nao7sep.mumbler
productName: Mumbler

directories:
  output: dist
  buildResources: build

# Ship the built app bundle (electron-vite's out/). Production dependencies and
# package.json are included automatically; source and tests are not.
files:
  - out/**
  - package.json
  # Runtime never consumes source maps or TypeScript declarations. Keep the
  # packaged dependency tree focused on executable code and required metadata.
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"

# asar stays at its default (enabled): mumbler bundles no executable native
# binaries. ffmpeg and ffprobe are managed downloads fetched at runtime into the
# app data dir (~/.mumbler/bin), never packaged, so there is nothing that an asar
# archive would trap.

# Tahoe "Liquid Glass" icon: the liquid-glass-icon tool deploys build/Assets.car (committed in
# company/assets) here. macOS 26 reads CFBundleIconName below → this catalog; older macOS reads
# CFBundleIconFile → build/icon.icns. Building does NOT need Xcode — the Assets.car is prebuilt.
extraResources:
  - from: build/Assets.car
    to: Assets.car
  - from: LICENSE
    to: LICENSE.txt
  - from: node_modules/electron/dist/LICENSE
    to: electron/LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: electron/LICENSES.chromium.html

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  extendInfo:
    CFBundleIconName: broadcast-mic-soundwaves
  # Ad-hoc sign the whole bundle (identity "-") so its seal is valid and the app
  # launches cleanly. No Apple Developer cert; CSC_IDENTITY_AUTO_DISCOVERY=false in
  # CI only blocks real-cert discovery — the "-" identity is what produces the seal.
  # macOS still shows "unidentified developer" until a Developer ID cert + notarization.
  identity: "-"
  # Pin arm64 explicitly so the macOS artifact's architecture is deterministic,
  # not inherited from whatever the build host/runner happens to be.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

win:
  icon: build/icon.ico
  target:
    - nsis
    - zip

# Clean, predictable installer filename (electron-builder's default is
# "Mumbler Setup X.Y.Z.exe", with a space). Portable zips keep their defaults.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  artifactName: ${productName}-${version}-setup.${ext}
